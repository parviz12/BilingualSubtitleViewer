name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle 8.13
        run: |
          curl -fL -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle Wrapper 8.13
        run: |
          gradle wrapper --gradle-version 8.13

      - name: Verify Gradle Version
        run: |
          ./gradlew --version

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BilingualSubtitleViewer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
