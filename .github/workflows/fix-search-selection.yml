name: Fix search selection persistence

on:
  push:
    paths:
      - '.github/workflows/fix-search-selection.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Patch MainActivity
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/example/bilingualsubviewer/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          if 'private var searchSelectionPosition = -1' not in text:
              text = text.replace(
                  'private var restoringSearch = false',
                  'private var restoringSearch = false\n    private var searchSelectionPosition = -1\n    private var restoreSearchScrollPending = false',
                  1,
              )

          text = text.replace(
              'searchQuery = ""\n            restoringSearch = true',
              'searchQuery = ""\n            searchSelectionPosition = -1\n            restoreSearchScrollPending = false\n            restoringSearch = true',
              1,
          )

          start = text.index('    private fun applySearch() {')
          end = text.index('    private fun filteredSubtitles(): List<Subtitle> {', start)
          new_apply = '''    private fun applySearch() {
        val clearingSearch = searchQuery.isBlank()
        val selectedForRestore = searchSelectionPosition.takeIf { it in subtitles.indices }
            ?: explicitlySelectedPosition.takeIf { it in subtitles.indices }
            ?: currentPosition.takeIf { it in subtitles.indices }

        val filtered = filteredSubtitles()
        subtitleAdapter.setItems(filtered)

        if (searchQuery.isNotBlank() && filtered.isEmpty()) {
            emptyText.text = getString(R.string.no_search_results)
            emptyText.visibility = View.VISIBLE
            return
        }

        emptyText.text = getString(R.string.open_subtitle_message)

        if (clearingSearch && selectedForRestore != null) {
            currentPosition = selectedForRestore
            explicitlySelectedPosition = selectedForRestore
            restoreSearchScrollPending = true
            subtitleAdapter.setCurrentIndex(subtitles[selectedForRestore].index)
        } else if (currentPosition in subtitles.indices) {
            subtitleAdapter.setCurrentIndex(subtitles[currentPosition].index)
        }

        updateUi()

        if (clearingSearch && selectedForRestore != null) {
            val restore = selectedForRestore
            subtitleList.post {
                subtitleList.layoutManager?.scrollToPositionWithOffset(restore, 0)
                restoreSearchScrollPending = false
            }
        }
    }

'''
          text = text[:start] + new_apply + text[end:]

          old_select = '''        currentPosition = i
        explicitlySelectedPosition = i
        repeatCount = 0
'''
          new_select = '''        currentPosition = i
        explicitlySelectedPosition = i
        if (searchQuery.isNotBlank()) {
            searchSelectionPosition = i
        }
        repeatCount = 0
'''
          if old_select in text and 'searchSelectionPosition = i' not in text:
              text = text.replace(old_select, new_select, 1)

          old_sync = '''            if (i != currentPosition) {
                currentPosition = i
                updateUi()
                scrollToSubtitle(subtitles[i])
            }
'''
          new_sync = '''            if (i != currentPosition) {
                currentPosition = i
                updateUi()
                if (!restoreSearchScrollPending) {
                    scrollToSubtitle(subtitles[i])
                }
            }
'''
          text = text.replace(old_sync, new_sync, 1)

          path.write_text(text, encoding='utf-8')
          print('Patch applied')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/bilingualsubviewer/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git commit -m 'Fix search result selection persistence'
          git push origin HEAD:main
